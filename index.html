<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zikirmatik — Geliştirici Sayfası</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --accent: #10b981;
      --border: #334155;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      max-width: 560px;
      width: 100%;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.3);
    }
    .badge {
      display: inline-block;
      font-size: 12px;
      font-weight: 600;
      color: var(--accent);
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.3);
      padding: 4px 10px;
      border-radius: 999px;
      margin-bottom: 14px;
    }
    h1 { font-size: 28px; margin-bottom: 10px; }
    p { color: var(--muted); line-height: 1.6; margin-bottom: 24px; }
    .links { display: flex; flex-wrap: wrap; gap: 12px; }
    a.btn {
      display: inline-block;
      text-decoration: none;
      padding: 10px 16px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 14px;
      transition: opacity 0.15s ease;
    }
    a.btn:hover { opacity: 0.88; }
    a.primary { background: var(--accent); color: #06281e; }
    a.secondary { background: transparent; color: var(--text); border: 1px solid var(--border); }
  </style>
</head>
<body>
  <main class="card">
    <span class="badge">Mobil Uygulama</span>
    <h1>Zikirmatik</h1>
    <p>
      Günlük zikir ve tesbihatlarınızı kolayca takip edebilmeniz için geliştirilmiş sade, modern ve kullanıcı dostu mobil uygulama.
    </p>
    <div class="links">
      <a class="btn primary" href="https://github.com/aslanomerazam/zikirmatik-app">Uygulama Sayfası</a>
      <a class="btn secondary" href="https://github.com/aslanomerazam/zikirmatik-privacy">Gizlilik Politikası</a>
    </div>
  </main>
</body>
</html>
